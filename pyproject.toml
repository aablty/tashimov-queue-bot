[project]
name = "tashimov-queue-bot"
version = "0.1.0"
description = "Telegram group queue bot"
requires-python = ">=3.12"
dependencies = [
    "aerich>=0.10.1",
    "aiohttp>=3.12.0",
    "aiogram>=3.31.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.138.1",
    "pydantic-settings>=2.14.2",
    "tomlkit>=0.15.1",
    "tortoise-orm>=1.1.7",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.49.0",
]

[tool.tortoise]
tortoise_orm = "src.core.config.config.tortoise_orm"
location = "src/db/migrations"
src_folder = "./."

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
